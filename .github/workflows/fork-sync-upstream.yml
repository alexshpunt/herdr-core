# Verify the exact upstream merge before fast-forwarding the personal fork.
name: fork sync upstream

on:
  schedule:
    - cron: '43 4 * * *'
  workflow_dispatch:

# Pushes use FORK_SYNC_TOKEN, a fine-grained token for this fork and herdr-app
# (contents, workflows, actions): GITHUB_TOKEN may not push the upstream commits
# that change .github/workflows. The merge job never holds it.
permissions:
  contents: read
  actions: read

concurrency:
  group: fork-core-upstream-sync
  cancel-in-progress: false

env:
  RUST_TOOLCHAIN: 1.95.0

jobs:
  prepare:
    if: github.repository == 'alexshpunt/herdr-core' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      changed: ${{ steps.candidate.outputs.changed }}
      branch: ${{ steps.candidate.outputs.branch }}
      sha: ${{ steps.candidate.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: master
          fetch-depth: 0
          submodules: true
          persist-credentials: false
      # Only for a conflict in the generated schema: scripts/fork-resolve-conflicts
      # regenerates it from the merged code.
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.16.0
      - name: Merge upstream into a local candidate
        id: candidate
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          result=$(python3 scripts/fork-sync.py prepare --resolver scripts/fork-resolve-conflicts --branch "automation/upstream-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}")
          printf '%s\n' "$result"
          printf '%s\n' "$result" | jq -r 'to_entries[] | "\(.key)=\(.value)"' >> "$GITHUB_OUTPUT"
      # Only the commits the fork lacks; publish rebuilds the branch from them in a clean job.
      - name: Bundle the candidate
        if: steps.candidate.outputs.changed == 'true'
        env:
          BRANCH: ${{ steps.candidate.outputs.branch }}
        run: git bundle create "$RUNNER_TEMP/candidate.bundle" "refs/heads/$BRANCH" ^refs/remotes/origin/master
      - if: steps.candidate.outputs.changed == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: candidate
          path: ${{ runner.temp }}/candidate.bundle
          retention-days: 3

  # A fresh checkout the merge job never touched pushes the exact candidate.
  publish:
    needs: prepare
    if: needs.prepare.outputs.changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: master
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: candidate
          path: ${{ runner.temp }}
      - name: Push the candidate branch
        env:
          GH_TOKEN: ${{ secrets.FORK_SYNC_TOKEN }}
          BRANCH: ${{ needs.prepare.outputs.branch }}
          SHA: ${{ needs.prepare.outputs.sha }}
        run: |
          [ -n "$GH_TOKEN" ] || { echo '::error::The FORK_SYNC_TOKEN repository secret is missing (see docs/FORK.md)'; exit 1; }
          git bundle verify "$RUNNER_TEMP/candidate.bundle"
          git fetch --no-tags "$RUNNER_TEMP/candidate.bundle" "refs/heads/$BRANCH:refs/heads/$BRANCH"
          gh auth setup-git
          python3 scripts/fork-sync.py publish --branch "$BRANCH" --sha "$SHA"

  verify:
    needs: [prepare, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 100
    permissions:
      actions: write
    steps:
      - name: Run core CI on the exact candidate
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ needs.prepare.outputs.branch }}
          SHA: ${{ needs.prepare.outputs.sha }}
        run: |
          set -euo pipefail
          gh workflow run ci.yml --repo "$GITHUB_REPOSITORY" --ref "$BRANCH"
          run=''
          for _ in $(seq 1 36); do
            run=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml --branch "$BRANCH" --event workflow_dispatch --limit 20 --json databaseId,headSha --jq "[.[] | select(.headSha == \"$SHA\") | .databaseId] | first // empty")
            [ -z "$run" ] || break
            sleep 5
          done
          [ -n "$run" ] || { echo 'CI did not start for the candidate'; exit 1; }
          gh run watch "$run" --repo "$GITHUB_REPOSITORY" --exit-status
          actual=$(gh run view "$run" --repo "$GITHUB_REPOSITORY" --json headSha --jq .headSha)
          [ "$actual" = "$SHA" ] || { echo 'CI ran on another commit'; exit 1; }

  land:
    needs: [prepare, verify]
    if: needs.verify.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: master
          fetch-depth: 0
          persist-credentials: false
      # A push with FORK_SYNC_TOKEN, unlike one with GITHUB_TOKEN, starts the
      # master workflows itself, fork-release among them.
      - name: Fast-forward only the verified candidate
        env:
          GH_TOKEN: ${{ secrets.FORK_SYNC_TOKEN }}
          BRANCH: ${{ needs.prepare.outputs.branch }}
          SHA: ${{ needs.prepare.outputs.sha }}
        run: |
          gh auth setup-git
          python3 scripts/fork-sync.py land --branch "$BRANCH" --sha "$SHA"

  # A conflict or a failed check stops the sync; a Linear issue makes sure someone sees it.
  notify:
    needs: [prepare, publish, verify, land]
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: master
          persist-credentials: false
      - name: Open or update the Linear issue
        env:
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/fork-sync-notify.py --repo "$GITHUB_REPOSITORY" --run-id "$GITHUB_RUN_ID" \
            --run-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            --result 'prepare=${{ needs.prepare.result }}' --result 'publish=${{ needs.publish.result }}' \
            --result 'verify=${{ needs.verify.result }}' --result 'land=${{ needs.land.result }}'
