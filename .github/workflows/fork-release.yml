# GitHub releases of the personal fork. No upstream credentials or v* tags.
name: fork release
run-name: fork release ${{ github.sha }}

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fork-core-release
  cancel-in-progress: false

env:
  RUST_TOOLCHAIN: 1.95.0

jobs:
  verify:
    if: github.repository == 'alexshpunt/herdr-core' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 100
    permissions:
      actions: read
      checks: read
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Test fork sync and Unix installer
        run: |
          python3 scripts/test_fork_sync.py
          python3 scripts/test_fork_install.py
          python3 scripts/test_fork_release.py
      - name: Require successful core CI for this exact commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          run=''
          for _ in $(seq 1 36); do
            run=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml --limit 100 --json databaseId,headSha --jq "[.[] | select(.headSha == \"$GITHUB_SHA\") | .databaseId] | first // empty")
            [ -z "$run" ] || break
            sleep 5
          done
          [ -n "$run" ] || { echo 'No CI run found for the release commit'; exit 1; }
          gh run watch "$run" --repo "$GITHUB_REPOSITORY" --exit-status
          actual=$(gh run view "$run" --repo "$GITHUB_REPOSITORY" --json headSha --jq .headSha)
          [ "$actual" = "$GITHUB_SHA" ] || { echo 'CI ran on another commit'; exit 1; }

  build:
    if: github.repository == 'alexshpunt/herdr-core' && github.ref == 'refs/heads/master'
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-x86_64, target: x86_64-unknown-linux-musl, runner: ubuntu-latest }
          - { name: linux-aarch64, target: aarch64-unknown-linux-musl, runner: ubuntu-22.04-arm }
          - { name: macos-aarch64, target: aarch64-apple-darwin, runner: macos-15 }
          - { name: macos-x86_64, target: x86_64-apple-darwin, runner: macos-15-intel }
          - { name: windows-x86_64, target: x86_64-pc-windows-msvc, runner: windows-2025 }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 75
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: ${{ matrix.target }}
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.16.0
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: fork-${{ matrix.target }}-release
          cache-workspace-crates: true
          cache-bin: false
      - name: Give this build its unique fork version
        run: |
          if [ "$RUNNER_OS" = Windows ]; then python scripts/fork_release.py version . "$GITHUB_RUN_NUMBER" "$GITHUB_RUN_ATTEMPT"
          else python3 scripts/fork_release.py version . "$GITHUB_RUN_NUMBER" "$GITHUB_RUN_ATTEMPT"; fi
      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }} -p herdr-core
      - name: Assemble ad-hoc signed macOS bundle
        if: runner.os == 'macOS'
        run: |
          bin='target/${{ matrix.target }}/release/herdr-core'
          sh scripts/mac-bundle "$bin" 'target/${{ matrix.target }}/release/Herdr Core.app'
          scripts/mac-sign 'target/${{ matrix.target }}/release/Herdr Core.app'
          scripts/mac-sign "$bin"
      - name: Pack Unix
        if: runner.os != 'Windows'
        run: |
          set -euo pipefail
          bin='target/${{ matrix.target }}/release/herdr-core'
          "$bin" --version
          if [ '${{ runner.os }}' = Linux ]; then
            file "$bin" | grep -q static
          fi
          mkdir -p dist
          if [ '${{ runner.os }}' = macOS ]; then bin="$(dirname "$bin")/Herdr Core.app"; fi
          sh scripts/package "$bin" 'dist/herdr-core-${{ matrix.name }}.tar.gz'
      - name: Pack Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $bin = 'target/${{ matrix.target }}/release/herdr-core.exe'
          & $bin --version
          if ($LASTEXITCODE) { throw 'core does not run' }
          $text = [Text.Encoding]::ASCII.GetString([IO.File]::ReadAllBytes($bin)).ToLower()
          foreach ($dll in 'vcruntime140', 'msvcp140', 'api-ms-win-crt-') { if ($text.Contains($dll)) { throw "core imports $dll" } }
          New-Item -ItemType Directory -Force stage/THIRD-PARTY-NOTICES, dist | Out-Null
          Copy-Item $bin stage/
          Copy-Item LICENSE stage/
          Copy-Item crates/herdr-core/THIRD-PARTY-NOTICES stage/THIRD-PARTY-NOTICES/herdr-core.txt
          scripts/fetch-conpty.ps1 -Dest stage
          Copy-Item distribution/windows/* stage/THIRD-PARTY-NOTICES/
          tar -a -cf 'dist/herdr-core-${{ matrix.name }}.zip' -C stage herdr-core.exe conpty LICENSE THIRD-PARTY-NOTICES
          if ($LASTEXITCODE) { throw 'zip failed' }
      - name: Test Windows installer with an isolated core
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/test-fork-install.ps1 -Source "$pwd/stage"
      - name: Checksum
        run: |
          set -euo pipefail
          for f in dist/herdr-core-*; do
            if command -v sha256sum >/dev/null; then sha256sum "$f" > "$f.sha256"
            else shasum -a 256 "$f" > "$f.sha256"; fi
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: herdr-core-${{ matrix.name }}
          path: dist/herdr-core-${{ matrix.name }}.*
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: [verify, build]
    if: github.repository == 'alexshpunt/herdr-core' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - name: Publish fork assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          head=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/master" --jq .object.sha)
          if [ "$head" != "$GITHUB_SHA" ]; then
            echo "Master advanced; this build will not become latest."
            exit 0
          fi
          tag="fork-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          python3 scripts/fork_release.py manifest . "$GITHUB_RUN_NUMBER" "$GITHUB_RUN_ATTEMPT"
          gh release create "$tag" dist/manifest.json dist/herdr-core-* distribution/fork-install.sh distribution/fork-install.ps1 \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "herdr-core fork build ${GITHUB_RUN_NUMBER}" \
            --notes "Build from ${GITHUB_SHA}. Windows is unsigned. macOS is ad-hoc signed and not notarized." --draft
          head=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/master" --jq .object.sha)
          if [ "$head" != "$GITHUB_SHA" ]; then
            gh release delete "$tag" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag
            echo 'Master advanced during upload; discarded the draft.'
            exit 0
          fi
          gh release edit "$tag" --repo "$GITHUB_REPOSITORY" --draft=false --latest
