# Every master push and PR: native Windows clippy and tests.
#
# Rust caches use one pinned toolchain and only master runs save, so PR
# caches can't evict the ones everybody restores. libghostty-vt stays with
# the workspace crates.
name: ci

on:
  push:
    branches: [master]
  # No paths-ignore here: CI is required to merge, so every PR needs it.
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Only superseded PR runs share a group; every other commit runs independently.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  RUST_TOOLCHAIN: 1.95.0
  # File/line backtraces without full debug info: smaller target, faster cache.
  CARGO_PROFILE_DEV_DEBUG: "1"
  CARGO_PROFILE_TEST_DEBUG: "1"
  SAVE_CACHES: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/master' }}
  # Each test binary aborts if it runs this long (a hang, not a slow test):
  # 30 s on our machines; GitHub's runners are slower.
  HC_TEST_WATCHDOG_S: "120"
  # A test that checks hc keeps a fixed timing (50 ms to finish a key
  # sequence) skips that check here: a loaded runner can't keep it.
  HC_TEST_SLOW_RUNNER: "1"

jobs:
  # Platform-independent formatting and advisory checks.
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: clippy, rustfmt
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: lint
          cache-bin: false
          save-if: ${{ env.SAVE_CACHES }}
      - run: cargo fmt --all -- --check
      # Advisories (RustSec), licenses, sources: deny.toml.
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check

  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows, runner: windows-2025, target: x86_64-pc-windows-msvc, threads: 2 }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: clippy
          targets: ${{ matrix.target }}
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.16.0
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: ${{ matrix.target }}-dev
          cache-workspace-crates: true
          cache-bin: false
          save-if: ${{ env.SAVE_CACHES }}
      - run: cargo clippy --locked --target ${{ matrix.target }} --all-targets -- -D warnings
      # Windows' own ConPTY swallows answers to programs: hc ships Microsoft's.
      - shell: pwsh
        run: scripts/fetch-conpty.ps1 -Dest target/${{ matrix.target }}/debug
      # cli_docs runs the built binary's help: generated reference freshness
      # and README/docs command/flag checks, with file:line failures.
      - name: Tests (including human docs)
        shell: bash
        run: cargo test --locked --no-fail-fast --target ${{ matrix.target }} -- --test-threads ${{ matrix.threads }}

  # Keep the required check name stable.
  ci-ok:
    needs: [lint, test]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: '[ "${{ needs.lint.result }}" = success ] && [ "${{ needs.test.result }}" = success ]'
